services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: usermanagement
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d usermanagement"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - usermanagement-postgres:/var/lib/postgresql/data

volumes:
  usermanagement-postgres:
